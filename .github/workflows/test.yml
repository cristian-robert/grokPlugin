name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: node --test "tests/**/*.test.mjs"

  # Installs the real grok CLI (not logged in) and checks that every argument the plugin
  # generates parses on each platform, and that the isolated HOME hides Claude config.
  grok-cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install grok (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
      - name: Install grok (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://x.ai/cli/install.ps1 | iex
          "$env:USERPROFILE\.grok\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: grok --version
      - run: node --test tests/smoke/grok-cli.smoke.mjs
